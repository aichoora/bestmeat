<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주문 완료 - 베스트미트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>

  <main class="wrap complete" id="main"></main>

  <footer id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const me = Auth.current();
    const o = Orders.find(param("id"));
    const main = document.getElementById("main");

    if (!o || !me || o.email !== me.email) {
      main.innerHTML = `<p class="empty">주문 정보를 찾을 수 없습니다.<br><br><a href="index.html" class="btn btn-red">메인으로</a></p>`;
    } else {
      const d = new Date(o.deliveryDate + "T00:00:00");
      const dateText = `${d.getMonth() + 1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`;
      const methods = { card: "신용카드", transfer: "계좌이체", deposit: "무통장입금", phone: "휴대폰 결제" };
      const pay = o.payment;
      const payText = pay.method === "card"
        ? `${pay.card} · ${pay.installment ? pay.installment + "개월 할부" : "일시불"}`
        : methods[pay.method];
      const due = new Date(new Date(o.createdAt).getTime() + 24 * 3600 * 1000);
      const r = o.receiver;
      const e = escapeHtml;

      main.innerHTML = `
        <ol class="steps"><li>장바구니</li><li>주문서 작성</li><li class="on">주문 완료</li></ol>
        <div class="done">
          <div class="done-icon">${o.status === "입금대기" ? "🧾" : "✅"}</div>
          <h1>${o.status === "입금대기" ? "주문이 접수되었습니다" : "주문이 완료되었습니다"}</h1>
          <p><b>${dateText}</b>에 신선하게 도착할 예정이에요.</p>
          <p class="order-no">주문번호 ${o.id}</p>
        </div>

        ${o.status === "입금대기" ? `
        <section class="box notice">
          <h2>입금 안내</h2>
          <dl class="info compact">
            <div><dt>입금 계좌</dt><dd><b>${e(pay.bank)} 000-0000-0000-00</b> (주)베스트미트</dd></div>
            <div><dt>입금 금액</dt><dd><b class="red">${won(o.amount.total)}</b></dd></div>
            <div><dt>입금자명</dt><dd>${e(pay.depositor)}</dd></div>
            <div><dt>입금 기한</dt><dd>${due.getMonth() + 1}월 ${due.getDate()}일 ${due.getHours()}시 ${String(due.getMinutes()).padStart(2, "0")}분까지</dd></div>
          </dl>
        </section>` : ""}

        <section class="box">
          <h2>주문 상품</h2>
          ${o.items.map((i) => {
            const p = findProduct(i.id);
            return `<div class="order-item">${p ? thumb(p) : ""}
              <div><p class="name">${e(i.name)} <small>${e(i.weight)}</small></p><p class="origin">수량 ${i.qty}개</p></div>
              <strong>${won(i.price * i.qty)}</strong></div>`;
          }).join("")}
        </section>

        <section class="box">
          <h2>배송 정보</h2>
          <dl class="info compact">
            <div><dt>받는 분</dt><dd>${e(r.name)} · ${e(r.phone)}</dd></div>
            <div><dt>주소</dt><dd>[${e(r.zip)}] ${e(r.addr1)} ${e(r.addr2)}</dd></div>
            <div><dt>요청사항</dt><dd>${e(r.memo || "-")}</dd></div>
            <div><dt>도착 희망일</dt><dd>${dateText}</dd></div>
          </dl>
        </section>

        <section class="box">
          <h2>결제 정보</h2>
          <dl class="info compact">
            <div><dt>결제 수단</dt><dd>${e(payText)}</dd></div>
            <div><dt>상품 금액</dt><dd>${won(o.amount.subtotal + o.amount.saved)}</dd></div>
            <div><dt>할인 금액</dt><dd>-${won(o.amount.saved + o.amount.coupon)}</dd></div>
            <div><dt>배송비</dt><dd>${o.amount.ship ? won(o.amount.ship) : "무료"}</dd></div>
            <div><dt>${o.status === "입금대기" ? "입금할 금액" : "결제 금액"}</dt><dd><b class="red">${won(o.amount.total)}</b></dd></div>
          </dl>
        </section>

        <div class="done-actions">
          <a href="index.html" class="btn btn-line">쇼핑 계속하기</a>
          <a href="products.html" class="btn btn-red">다른 상품 보기</a>
        </div>`;
    }
  </script>
</body>
</html>
