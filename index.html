<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>베스트미트 - 믿을 수 있는 고기 쇼핑</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>

  <section class="hero">
    <div class="wrap">
      <div>
        <h1>산지에서 식탁까지,<br>가장 신선한 고기</h1>
        <p>오늘 손질한 고기를 콜드체인으로 내일 아침 받아보세요.</p>
        <a href="products.html" class="btn btn-white">지금 쇼핑하기</a>
      </div>
      <div class="art">🥩</div>
    </div>
  </section>

  <main class="wrap">
    <nav class="cats" id="cats"></nav>

    <section class="section">
      <div class="section-head"><h2>🔥 이번 주 베스트</h2><a href="products.html?sort=reviews">더보기 ›</a></div>
      <div class="grid" id="best"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2>💸 오늘의 특가</h2><a href="products.html?sort=discount">더보기 ›</a></div>
      <div class="grid" id="deal"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2>🎁 선물세트</h2><a href="products.html?cat=gift">더보기 ›</a></div>
      <div class="grid" id="gift"></div>
    </section>
  </main>

  <section class="promise">
    <div class="wrap">
      <div><span class="ico">❄️</span><b>콜드체인 배송</b><p>0~4℃를 유지한 채 문 앞까지</p></div>
      <div><span class="ico">🔪</span><b>주문 후 손질</b><p>주문이 들어오면 그날 바로 손질</p></div>
      <div><span class="ico">✅</span><b>이력 추적</b><p>모든 상품의 원산지와 등급 공개</p></div>
    </div>
  </section>

  <footer id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("cats").innerHTML = CATEGORIES
      .map((c) => `<a href="products.html?cat=${c.id}"><span>${c.icon}</span>${c.name}</a>`).join("");

    const render = (id, list) => document.getElementById(id).innerHTML = list.slice(0, 4).map(productCard).join("");
    render("best", [...PRODUCTS].sort((a, b) => b.reviews - a.reviews));
    render("deal", [...PRODUCTS].sort((a, b) => discount(b) - discount(a)));
    render("gift", PRODUCTS.filter((p) => p.cat === "gift" || p.price >= 50000));
  </script>
</body>
</html>
