<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기획전 - 베스트미트</title>
  <link rel="icon" href="images/logo-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>

  <div id="main"></div>

  <footer id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/reviews-sample.js"></script>
  <script src="js/events.js"></script>
  <script src="js/app.js"></script>
  <script>
    const ev = findEvent(param("id"));
    const main = document.getElementById("main");

    if (!ev) {
      main.innerHTML = `<main class="wrap"><p class="empty">기획전을 찾을 수 없습니다. <a href="events.html" style="color:var(--red)">기획전 목록으로</a></p></main>`;
    } else {
      document.title = `${ev.title} - 베스트미트`;
      const s = eventStatus(ev);
      const items = ev.products.map(findProduct).filter(Boolean);
      main.innerHTML = `
        <section class="hero event-hero">
          <div class="hero-slide">
            <img src="${ev.img}" alt="">
            <div class="wrap">
              <span class="tag">${ev.tag}</span>
              <h1>${ev.title}</h1>
              <p>${ev.sub}</p>
              <span class="event-hero-period">${eventPeriod(ev)} <b class="event-state ${s.cls}">${s.label}${s.dday ? ` · ${s.dday}` : ""}</b></span>
            </div>
          </div>
        </section>
        <main class="wrap">
          ${s.cls === "ended" ? `<p class="event-ended-note">종료된 기획전입니다. 상품은 일반 가격으로 구매하실 수 있어요.</p>` : ""}
          <ul class="event-benefits">${ev.benefits.map((b) => `<li>${icon("check")}${b}</li>`).join("")}</ul>
          <section class="section">
            <div class="section-head"><h2>기획전 상품 <small>${items.length}</small></h2><a href="events.html">다른 기획전 ›</a></div>
            <div class="grid">${items.map(productCard).join("") || `<p class="empty" style="grid-column:1/-1">준비 중인 상품이 없어요.</p>`}</div>
          </section>
        </main>`;
    }
  </script>
</body>
</html>
