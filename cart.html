<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장바구니 - 베스트미트</title>
  <link rel="icon" href="images/logo-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>

  <main class="wrap">
    <h1 class="page-title">장바구니</h1>
    <div id="cart"></div>
  </main>

  <footer id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function draw() {
      const { items, soldOut, subtotal, saved, ship } = cartSummary();
      const box = document.getElementById("cart");

      // 품절 상품: 주문에서 빠진다는 안내와 함께 따로 표시
      const soldOutHtml = soldOut.length ? `
        <div class="soldout-box">
          <p><b>품절된 상품 ${soldOut.length}개</b>는 주문에서 제외됩니다.</p>
          ${soldOut.map(({ p }) => `
            <div class="cart-item muted">
              <a href="product.html?id=${p.id}">${thumb(p)}</a>
              <div><p class="name">${p.name} <small>${p.weight}</small></p><p class="origin">일시 품절</p></div>
              <span></span>
              <button class="remove" onclick="Cart.remove(${p.id}); draw()" aria-label="삭제">✕</button>
            </div>`).join("")}
        </div>` : "";

      if (!items.length && soldOut.length) {
        box.innerHTML = soldOutHtml + `<div class="empty"><a href="products.html" class="btn btn-red">다른 상품 보러 가기</a></div>`;
        return;
      }
      if (!items.length) {
        box.innerHTML = `<div class="empty"><img src="images/icons/cart-empty.svg" alt="" class="empty-ico"><p>장바구니가 비어 있어요.</p><br>
          <a href="products.html" class="btn btn-red">쇼핑하러 가기</a></div>`;
        return;
      }

      box.innerHTML = `
        <div class="cart-layout">
          <div>
            ${items.map(({ p, qty }) => `
              <div class="cart-item">
                <a href="product.html?id=${p.id}">${thumb(p)}</a>
                <div>
                  <a href="product.html?id=${p.id}" class="name">${p.name} <small>${p.weight}</small></a>
                  <p class="price"><strong>${won(p.sale * qty)}</strong></p>
                </div>
                <div class="qty">
                  <button onclick="Cart.setQty(${p.id}, ${qty - 1}); draw()">−</button>
                  <input value="${qty}" readonly>
                  <button onclick="Cart.setQty(${p.id}, ${qty + 1}); draw()">+</button>
                </div>
                <button class="remove" onclick="Cart.remove(${p.id}); draw()" aria-label="삭제">✕</button>
              </div>`).join("")}
            ${soldOutHtml}
          </div>
          <aside class="summary">
            <div><span>상품금액</span><span>${won(subtotal)}</span></div>
            <div><span>할인금액</span><span>-${won(saved)}</span></div>
            <div><span>배송비</span><span>${ship ? won(ship) : "무료"}</span></div>
            <div class="sum"><span>결제예정금액</span><span>${won(subtotal + ship)}</span></div>
            ${ship ? `<p class="hint">${won(SHIPPING.free - subtotal)} 더 담으면 무료배송!</p>` : ""}
            <button class="btn btn-red" onclick="order()">주문하기</button>
          </aside>
        </div>`;
    }

    function order() {
      if (!Auth.current()) {
        if (confirm("주문하려면 로그인이 필요합니다. 로그인 하시겠어요?")) location.href = "login.html?next=checkout.html";
        return;
      }
      location.href = "checkout.html";
    }

    draw();
  </script>
</body>
</html>
