<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객센터 - 베스트미트</title>
  <link rel="icon" href="images/logo-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>

  <main class="wrap">
    <h1 class="page-title">고객센터</h1>

    <section class="cs-top" id="cs-top"></section>

    <div class="my-layout">
      <nav class="my-menu cs-menu" id="menu">
        <a href="#notice"><i data-icon="megaphone"></i> 공지사항</a>
        <a href="#faq"><i data-icon="help"></i> 자주 묻는 질문</a>
        <a href="#qna"><i data-icon="chat"></i> 1:1 문의</a>
      </nav>

      <div>
        <!-- 공지사항 -->
        <section class="tab" id="tab-notice">
          <div class="section-head"><h2>공지사항</h2></div>
          <div class="acc-list" id="notice-list"></div>
        </section>

        <!-- 자주 묻는 질문 -->
        <section class="tab" id="tab-faq" hidden>
          <div class="section-head"><h2>자주 묻는 질문</h2></div>
          <input type="search" class="faq-search" id="faq-q" placeholder="궁금한 내용을 검색해 보세요 (예: 배송비, 환불)">
          <div class="chips small faq-cats" id="faq-cats" role="radiogroup" aria-label="질문 분류"></div>
          <div class="acc-list" id="faq-list"></div>
          <p class="muted-text faq-more">원하는 답을 찾지 못하셨나요? <a href="#qna" class="link">1:1 문의하기 ›</a></p>
        </section>

        <!-- 1:1 문의 -->
        <section class="tab" id="tab-qna" hidden>
          <div class="section-head"><h2>1:1 문의</h2>
            <button type="button" class="btn btn-red sm" id="qna-new">문의하기</button></div>
          <form class="box my-form qna-form" id="qna-form" novalidate hidden>
            <div class="cols">
              <div class="field"><label for="q-type">문의 유형</label><select id="q-type"></select></div>
              <div class="field"><label for="q-order">관련 주문 (선택)</label><select id="q-order"></select></div>
            </div>
            <div class="field"><label for="q-title">제목 <i>*</i></label><input id="q-title" maxlength="60" placeholder="문의 제목을 입력해 주세요"><p class="msg"></p></div>
            <div class="field"><label for="q-body">내용 <i>*</i></label>
              <textarea id="q-body" rows="6" maxlength="1000" placeholder="문의 내용을 자세히 적어 주시면 더 빠르게 도와드릴 수 있어요. (10자 이상)"></textarea>
              <p class="msg"><span id="q-count">0</span> / 1000자</p></div>
            <div class="form-actions">
              <button type="button" class="btn btn-line" id="qna-cancel">취소</button>
              <button class="btn btn-red">문의 등록</button>
            </div>
          </form>
          <div id="qna-list"></div>
        </section>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/reviews-sample.js"></script>
  <script src="js/app.js"></script>
  <script src="js/support.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const e = escapeHtml;

    // ---------- 상단 연락처 ----------
    $("cs-top").innerHTML = `
      <div class="cs-call"><small>고객센터</small><b>${SUPPORT.phone}</b><span>${SUPPORT.hours}</span></div>
      <a href="#faq" class="cs-link">${icon("help")}<b>자주 묻는 질문</b><span>궁금한 점을 바로 찾아보세요</span></a>
      <a href="#qna" class="cs-link">${icon("chat")}<b>1:1 문의</b><span>답변은 평일 기준 하루 안에 드려요</span></a>`;

    // ---------- 탭 (주소 끝 #notice, #faq, #qna) ----------
    const TABS = ["notice", "faq", "qna"];
    function showTab() {
      const name = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "notice";
      document.querySelectorAll(".tab").forEach((t) => (t.hidden = t.id !== "tab-" + name));
      document.querySelectorAll("#menu a").forEach((a) => a.classList.toggle("on", a.hash === "#" + name));
    }
    window.addEventListener("hashchange", showTab);

    // 펼치고 접는 목록 (공지·FAQ 공통): <details>를 써서 키보드로도 열고 닫을 수 있음
    const accItem = (head, body, cls = "") => `
      <details class="acc ${cls}"><summary>${head}</summary><div class="acc-body">${body}</div></details>`;

    // ---------- 공지사항 ----------
    function drawNotices() {
      const list = Notices.all();
      $("notice-list").innerHTML = list.length ? list.map((n) => accItem(
        `${n.pinned ? `<em class="pin">중요</em>` : ""}<span class="acc-title">${e(n.title)}</span><span class="acc-date">${n.date.replace(/-/g, ".")}</span>`,
        e(n.body), n.pinned ? "pinned" : "")).join("") : `<p class="empty small">등록된 공지가 없습니다.</p>`;
    }

    // ---------- 자주 묻는 질문 ----------
    let faqCat = "";
    $("faq-cats").innerHTML = ["", ...new Set(FAQS.map((f) => f.cat))]
      .map((c) => `<label><input type="radio" name="faq-cat" value="${c}" ${c === "" ? "checked" : ""}><span>${c || "전체"}</span></label>`).join("");
    document.querySelectorAll("input[name=faq-cat]").forEach((r) => r.addEventListener("change", () => { faqCat = r.value; drawFaq(); }));
    function drawFaq() {
      const q = $("faq-q").value.trim();
      const list = FAQS.filter((f) => (!faqCat || f.cat === faqCat) && (!q || (f.q + f.a).includes(q)));
      $("faq-list").innerHTML = list.length ? list.map((f) => accItem(
        `<b class="faq-q">Q</b><span class="acc-cat">${f.cat}</span><span class="acc-title">${e(f.q)}</span>`,
        `<b class="faq-a">A</b><div>${e(f.a)}</div>`, "faq")).join("")
        : `<p class="empty small">'${e(q)}'에 대한 질문을 찾지 못했어요.</p>`;
      // 검색했을 때 결과가 하나면 바로 펼쳐줌
      if (q && list.length === 1) $("faq-list").querySelector("details").open = true;
    }
    $("faq-q").addEventListener("input", drawFaq);

    // ---------- 1:1 문의 ----------
    $("q-type").innerHTML = INQUIRY_TYPES.map((t) => `<option>${t}</option>`).join("");
    function fillOrders() {
      const orders = Orders.mine().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      $("q-order").innerHTML = `<option value="">선택 안 함</option>` + orders.map((o) =>
        `<option value="${o.id}">${o.id} · ${e(o.items[0]?.name || "")}${o.items.length > 1 ? ` 외 ${o.items.length - 1}건` : ""}</option>`).join("");
    }
    $("qna-new").addEventListener("click", () => {
      if (!Auth.current()) {
        if (confirm("1:1 문의는 로그인 후 이용할 수 있습니다. 로그인 하시겠어요?")) location.href = "login.html?next=" + encodeURIComponent("support.html#qna");
        return;
      }
      fillOrders();
      $("qna-form").hidden = false;
      $("q-title").focus();
    });
    $("qna-cancel").addEventListener("click", () => { $("qna-form").reset(); $("q-count").textContent = 0; $("qna-form").hidden = true; });
    $("q-body").addEventListener("input", () => ($("q-count").textContent = $("q-body").value.length));

    function setField(input, err, normal = "") {
      const field = input.closest(".field");
      field.classList.toggle("invalid", !!err);
      if (err || normal) field.querySelector(".msg").textContent = err || normal;
      return !err;
    }
    $("qna-form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const title = $("q-title").value.trim();
      const body = $("q-body").value.trim();
      const ok = [
        setField($("q-title"), title ? "" : "제목을 입력해 주세요."),
        setField($("q-body"), body.length >= 10 ? "" : `10자 이상 적어 주세요. (지금 ${body.length}자)`, ""),
      ].every(Boolean);
      if (!ok) return;
      Inquiries.add({ type: $("q-type").value, orderId: $("q-order").value, title, body });
      $("qna-form").reset();
      $("q-count").textContent = 0;
      $("qna-form").hidden = true;
      toast("문의를 등록했습니다. 빠르게 답변드릴게요.");
      drawQna();
    });

    function drawQna() {
      if (!Auth.current()) {
        $("qna-list").innerHTML = `<div class="empty small"><p>로그인하시면 문의를 남기고 답변을 확인할 수 있어요.</p><br>
          <a href="login.html?next=${encodeURIComponent("support.html#qna")}" class="btn btn-red">로그인</a></div>`;
        return;
      }
      const list = Inquiries.mine().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      $("qna-list").innerHTML = list.length ? `<div class="acc-list">${list.map((q) => accItem(
        `${inquiryBadge(q)}<span class="acc-cat">${q.type}</span><span class="acc-title">${e(q.title)}</span><span class="acc-date">${fmtDay(q.createdAt)}</span>`,
        `${q.orderId ? `<p class="qna-order">관련 주문: <a href="order-complete.html?id=${q.orderId}" class="link">${q.orderId}</a></p>` : ""}
         <div class="qna-q">${e(q.body)}</div>
         ${q.answer
           ? `<div class="qna-a"><b>베스트미트 답변</b><small>${fmtDay(q.answeredAt)}</small><div>${e(q.answer)}</div></div>`
           : `<p class="qna-wait">담당자가 확인 중입니다. 평일 기준 하루 안에 답변드릴게요.
              <button type="button" class="link-btn" onclick="deleteQna('${q.id}')">문의 삭제</button></p>`}`)).join("")}</div>`
        : `<p class="empty small">아직 남긴 문의가 없어요.</p>`;
    }
    function deleteQna(id) {
      if (!confirm("이 문의를 삭제할까요?")) return;
      if (Inquiries.remove(id)) { toast("문의를 삭제했습니다."); drawQna(); }
    }

    showTab();
    drawNotices();
    drawFaq();
    drawQna();
  </script>
</body>
</html>
