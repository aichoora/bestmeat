<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 상세 - 베스트미트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>

  <main class="wrap" id="main"></main>

  <footer id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const p = findProduct(param("id"));
    const main = document.getElementById("main");

    if (!p) {
      main.innerHTML = `<p class="empty">상품을 찾을 수 없습니다. <a href="products.html" style="color:var(--red)">목록으로</a></p>`;
    } else {
      document.title = `${p.name} - 베스트미트`;
      const catName = CATEGORIES.find((c) => c.id === p.cat).name;
      main.innerHTML = `
        <div class="detail">
          ${thumb(p, true)}
          <div>
            <p class="origin"><a href="products.html?cat=${p.cat}">${catName}</a> › ${p.origin}</p>
            <h1>${p.name}</h1>
            <p class="rating">${p.reviews ? `★ ${p.rating} <span>리뷰 ${p.reviews.toLocaleString()}개</span>` : `<span>새 상품</span>`}</p>
            <p class="price"><b class="rate">${discount(p)}%</b> <strong>${won(p.sale)}</strong> <del>${won(p.price)}</del></p>
            <dl class="info">
              <div><dt>원산지</dt><dd>${p.origin}</dd></div>
              <div><dt>등급</dt><dd>${p.grade}</dd></div>
              <div><dt>중량</dt><dd>${p.weight}</dd></div>
              <div><dt>배송</dt><dd>냉장 택배 · 오후 3시 전 주문 시 오늘 출발</dd></div>
            </dl>
            <div class="qty">
              <button onclick="changeQty(-1)">−</button>
              <input id="qty" value="1" inputmode="numeric" oninput="changeQty(0)">
              <button onclick="changeQty(1)">+</button>
            </div>
            <div class="total"><span>총 상품금액</span><strong id="total">${won(p.sale)}</strong></div>
            <div class="actions">
              ${p.soldOut
                ? `<button class="btn btn-line" disabled>일시 품절된 상품입니다</button>`
                : `<button class="btn btn-line" onclick="addToCart(p.id, getQty())">장바구니</button>
                   <button class="btn btn-red" onclick="if (addToCart(p.id, getQty())) location.href='cart.html'">바로 구매</button>`}
            </div>
          </div>
        </div>
        <section class="section">
          <div class="section-head"><h2>상품 설명</h2></div>
          <div class="desc-box">${p.desc}<br><br>
            ✔ 받으신 후 냉장 보관하시고 3일 안에 드시는 것을 권해드립니다.<br>
            ✔ 오래 보관하실 때는 한 번 먹을 양씩 나눠 냉동해 주세요.</div>
        </section>
        <section class="section">
          <div class="section-head"><h2>함께 보면 좋은 상품</h2></div>
          <div class="grid">${PRODUCTS.filter((x) => x.cat === p.cat && x.id !== p.id).slice(0, 4).map(productCard).join("")}</div>
        </section>`;
    }

    function getQty() {
      return Math.max(1, parseInt(document.getElementById("qty").value) || 1);
    }
    function changeQty(d) {
      const input = document.getElementById("qty");
      const n = Math.max(1, getQty() + d);
      if (d !== 0) input.value = n;
      document.getElementById("total").textContent = won(p.sale * n);
    }
  </script>
</body>
</html>
