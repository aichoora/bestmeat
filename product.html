<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 상세 - 베스트미트</title>
  <link rel="icon" href="images/logo-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>

  <main class="wrap" id="main"></main>

  <footer id="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/reviews-sample.js"></script>
  <script src="js/app.js"></script>
  <script>
    const p = findProduct(param("id"));
    const opts = p ? productOptions(p) : [];
    const main = document.getElementById("main");

    if (!p) {
      main.innerHTML = `<p class="empty">상품을 찾을 수 없습니다. <a href="products.html" style="color:var(--red)">목록으로</a></p>`;
    } else {
      document.title = `${p.name} - 베스트미트`;
      Recent.add(p.id); // 최근 본 상품에 기록
      const catName = CATEGORIES.find((c) => c.id === p.cat).name;
      main.innerHTML = `
        <div class="detail">
          ${thumb(p, true)}
          <div>
            <p class="origin"><a href="products.html?cat=${p.cat}">${catName}</a> › ${p.origin}</p>
            <h1>${p.name}</h1>
            <p class="rating" id="rating-top"></p>
            <p class="price" id="price"></p>
            <dl class="info">
              <div><dt>원산지</dt><dd>${p.origin}</dd></div>
              <div><dt>등급</dt><dd>${p.grade}</dd></div>
              <div><dt>중량</dt><dd id="weight"></dd></div>
              <div><dt>배송</dt><dd>냉장 택배 · 오후 3시 전 주문 시 오늘 출발</dd></div>
            </dl>
            ${opts.length > 1 ? `
            <div class="opt-select">
              <p class="opt-title">중량 선택</p>
              <div class="chips opts" role="radiogroup" aria-label="중량 선택">
                ${opts.map((o, i) => `<label><input type="radio" name="opt" value="${i}" ${i === 0 ? "checked" : ""} onchange="update()">
                  <span><b>${escapeHtml(o.label)}</b><small>${won(o.sale)}</small></span></label>`).join("")}
              </div>
            </div>` : ""}
            <div class="qty">
              <button onclick="changeQty(-1)">−</button>
              <input id="qty" value="1" inputmode="numeric" oninput="changeQty(0)">
              <button onclick="changeQty(1)">+</button>
            </div>
            <div class="total"><span>총 상품금액</span><strong id="total"></strong></div>
            <div class="actions">
              ${p.soldOut
                ? `${wishButton(p, "btn-wish-lg")}<button class="btn btn-line" disabled>일시 품절된 상품입니다</button>`
                : `${wishButton(p, "btn-wish-lg")}<button class="btn btn-line" onclick="addToCart(p.id, getQty(), cur().label)">장바구니</button>
                   <button class="btn btn-red" onclick="if (addToCart(p.id, getQty(), cur().label)) location.href='cart.html'">바로 구매</button>`}
            </div>
          </div>
        </div>
        <section class="section">
          <div class="section-head"><h2>상품 설명</h2></div>
          <div class="desc-box">${p.desc}<br><br>
            <ul class="check-list">
              <li>${icon("check")}받으신 후 냉장 보관하시고 3일 안에 드시는 것을 권해드립니다.</li>
              <li>${icon("check")}오래 보관하실 때는 한 번 먹을 양씩 나눠 냉동해 주세요.</li>
            </ul></div>
        </section>
        <section class="section" id="reviews">
          <div class="section-head"><h2>리뷰 <small id="review-count"></small></h2>
            <button type="button" class="btn btn-line sm" onclick="writeReview()">${icon("pen")} 리뷰 쓰기</button></div>
          <div class="review-summary" id="review-summary"></div>
          <div class="review-tools">
            <select id="review-sort" aria-label="리뷰 정렬">
              <option value="new">최신순</option><option value="high">별점 높은순</option><option value="low">별점 낮은순</option>
            </select>
          </div>
          <div id="review-list"></div>
          <button type="button" class="btn btn-line review-more" id="review-more" hidden>리뷰 더보기</button>
        </section>
        <section class="section">
          <div class="section-head"><h2>함께 보면 좋은 상품</h2></div>
          <div class="grid">${PRODUCTS.filter((x) => x.cat === p.cat && x.id !== p.id).slice(0, 4).map(productCard).join("")}</div>
        </section>`;
    }

    // 지금 고른 옵션
    function cur() {
      const checked = document.querySelector("input[name=opt]:checked");
      return opts[checked ? Number(checked.value) : 0];
    }
    function getQty() {
      return Math.max(1, parseInt(document.getElementById("qty").value) || 1);
    }
    function changeQty(d) {
      const input = document.getElementById("qty");
      const n = Math.max(1, getQty() + d);
      if (d !== 0) input.value = n;
      update();
    }
    // 옵션이나 수량이 바뀌면 가격, 중량, 총액을 다시 표시
    function update() {
      const o = cur();
      const rate = Math.round((1 - o.sale / o.price) * 100);
      document.getElementById("price").innerHTML = `<b class="rate">${rate}%</b> <strong>${won(o.sale)}</strong> <del>${won(o.price)}</del>`;
      document.getElementById("weight").textContent = o.label;
      document.getElementById("total").textContent = won(o.sale * getQty());
    }
    if (p) update();

    // ---------- 리뷰 ----------
    let reviewShown = 5;
    function drawReviews() {
      const s = Reviews.stats(p.id);
      const me = Auth.current();
      document.getElementById("rating-top").innerHTML = s.n
        ? `★ ${s.avg.toFixed(1)} <a href="#reviews"><span>리뷰 ${s.n.toLocaleString()}개</span></a>`
        : `<span>아직 리뷰가 없어요</span>`;
      document.getElementById("review-count").textContent = s.n ? s.n.toLocaleString() : "";
      document.getElementById("review-summary").innerHTML = s.n ? `
        <div class="review-avg"><strong>${s.avg.toFixed(1)}</strong>${stars(s.avg)}<small>리뷰 ${s.n}개</small></div>
        <div class="review-dist">${s.dist.map((c, i) => `
          <div><span>${5 - i}점</span><span class="bar"><i style="width:${(c / s.n) * 100}%"></i></span><span>${c}</span></div>`).join("")}</div>`
        : `<p class="muted-text">첫 리뷰를 남겨 주세요. 배송이 완료된 주문의 상품만 리뷰를 쓸 수 있어요.</p>`;
      const sort = document.getElementById("review-sort").value;
      const list = Reviews.forProduct(p.id).sort((a, b) =>
        sort === "high" ? b.rating - a.rating || b.createdAt.localeCompare(a.createdAt)
        : sort === "low" ? a.rating - b.rating || b.createdAt.localeCompare(a.createdAt) : 0);
      document.getElementById("review-list").innerHTML = list.slice(0, reviewShown).map((r) => `
        <article class="review">
          <div class="review-top">${stars(r.rating)}<b>${escapeHtml(r.name)}</b><span class="date">${reviewDate(r.createdAt)}</span>
            ${me && r.email === me.email ? `<button type="button" class="link-btn" onclick="deleteReview('${r.id}')">삭제</button>` : ""}</div>
          ${productOptions(p).length > 1 ? `<p class="review-opt">옵션: ${escapeHtml(r.opt)}</p>` : ""}
          <p class="review-text">${escapeHtml(r.text)}</p>
        </article>`).join("");
      document.getElementById("review-more").hidden = list.length <= reviewShown;
    }
    function writeReview() {
      if (!Auth.current()) {
        if (confirm("리뷰를 쓰려면 로그인이 필요합니다. 로그인 하시겠어요?")) location.href = `login.html?next=${encodeURIComponent("product.html?id=" + p.id)}`;
        return;
      }
      const targets = Reviews.writable({ productId: p.id });
      if (!targets.length) {
        alert("배송이 완료된 주문의 상품만 리뷰를 쓸 수 있어요.\n이미 리뷰를 쓰셨다면 마이페이지 > 내 리뷰에서 확인할 수 있습니다.");
        return;
      }
      openReviewForm(targets, drawReviews);
    }
    function deleteReview(id) {
      if (!confirm("이 리뷰를 삭제할까요?")) return;
      Reviews.remove(id);
      toast("리뷰를 삭제했습니다.");
      drawReviews();
    }
    if (p) {
      document.getElementById("review-sort").addEventListener("change", () => { reviewShown = 5; drawReviews(); });
      document.getElementById("review-more").addEventListener("click", () => { reviewShown += 5; drawReviews(); });
      drawReviews();
    }
  </script>
</body>
</html>
